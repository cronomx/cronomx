name: Actualizar estadísticas del perfil

on:
    schedule:
        - cron: "17 6 * * *"
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Descargar repositorio
              uses: actions/checkout@v4

            - name: Generar tarjetas
              uses: vn7n24fzkq/github-profile-summary-cards@release
              env:
                    GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
              with:
                    USERNAME: ${{ github.repository_owner }}
                    BRANCH_NAME: main
                    UTC_OFFSET: -6
                    THEME: github_dark
                    ANIMATION: load
                    DURATION: 2
                    AUTO_PUSH: true
