name: Generate GitHub Profile Stats SVG

on:
  schedule:
    - cron: '0 */12 * * *' # Automatically updates every 12 hours
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-stats-svg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Activity Graph SVG
        uses: ashutosh00710/github-readme-activity-graph@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically authorized to see your private counts securely
        with:
          USERNAME: cronomx
          THEME: tokyonight
          OUTPUT: ./github-profile-activity-graph.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update profile activity graph SVG"
          git push
